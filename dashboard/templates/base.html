<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trading System Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">🎯 Trading System</a>
            <div class="navbar-nav flex-row">
                <a class="nav-link px-3" href="/">Dashboard</a>
                <a class="nav-link px-3" href="/strategies">Strategies</a>
                <a class="nav-link px-3" href="/positions">Positions</a>
                <a class="nav-link px-3" href="/performance">Performance</a>
                <a class="nav-link px-3" href="/settings">Settings</a>
            </div>
        </div>
    </nav>
    
    <div class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/websocket.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
